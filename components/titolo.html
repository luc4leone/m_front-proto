<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>titolo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
    rel="preload"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />

  <link rel="stylesheet" href="./showcase.css" />

<body>
  <main class="showcase">

    <h1>titolo</h1>

    <div class="showcase__cases">

    <section class="showcase__case">
      <p>Titolo pagina (h1):</p>
      <div class="showcase__display">
        <h1 class="titolo titolo--pagina">Titolo Pagina</h1>
      </div>
    </section>

    <section class="showcase__case">
      <p>Titolo sezione (h2):</p>
      <div class="showcase__display">
        <h2 class="titolo titolo--sezione">Titolo Sezione</h2>
      </div>
    </section>

    <section class="showcase__case">
      <p>Titolo sotto-sezione (h3):</p>
      <div class="showcase__display">
        <h3 class="titolo titolo--sotto-sezione">Titolo Sotto-sezione</h3>
      </div>
    </section>

    <section class="showcase__case">
      <p>Titolo sotto-sotto-sezione (h4):</p>
      <div class="showcase__display">
        <h4 class="titolo titolo--sotto-sotto-sezione">Titolo Sotto-sotto-sezione</h4>
      </div>
    </section>

    </div>

  </main>
