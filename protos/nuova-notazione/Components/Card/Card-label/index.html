<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card-label component</title>
  <link rel="stylesheet" href="../../../../../css/reset.css">
  <link rel="stylesheet" href="../../../tokens.css">
  <link rel="stylesheet" href="../../Text/text.css">
  <link rel="stylesheet" href="card-label.css">
  <style>
    body { font-family: var(--font-sans); padding: 2rem; }
  </style>
</head>
<body>

  <!--
    def Text variant Card-label {
      [Text text="card label" text-sm text-grey-900]
    }

    overrides:
      font-size: text-sm  → var(--text-sm)     = 0.875rem
      color:     text-grey-900 → var(--text-grey-900) = #999
  -->

  <!-- [Card-label text="card label"] — tutti i valori default -->
  <p class="text card-label">card label</p>

</body>
</html>
