<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banca dati</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; font-size: 13px; background: #fff; color: #000; }
    .layout { padding: 16px; }
    .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    input[type="search"] {
      font-family: inherit; font-size: inherit;
      border: 1px solid #000; padding: 4px 8px;
      width: 360px; outline: none; border-radius: 0;
      -webkit-appearance: none; appearance: none;
    }
    #count { color: #999; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
    th { border-color: #000; background: #f5f5f5; }
    .cell--note { font-size: 11px; color: #555; max-width: 240px; }
    .no-results { padding: 16px 0; color: #999; }
    .pagination { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    button {
      font-family: inherit; font-size: inherit;
      border: 1px solid #000; background: #fff;
      padding: 3px 10px; cursor: pointer; border-radius: 0;
    }
    button:disabled { opacity: 0.25; cursor: default; }
    button:hover:not(:disabled) { background: #000; color: #fff; }
  </style>
</head>
<body>

  <main id="app"></main>

  <script type="module" src="./js/main.js"></script>

</body>
</html>
