    @font-face {

    body {

      color: var(--text-zinc-500);
      padding: 20px;
    }

    h1 {
      margin: 0 0 var(--gap-40) 0;
    }

    /* stack gap-40, indented gap-16 */
    .index {
      display: flex;
      flex-direction: column;
      gap: var(--gap-40);
      max-width: fit-content;
    }

    /* Index-item: stack gap-12 */
    .index-item {
      display: flex;
      flex-direction: column;
      gap: var(--gap-12);
    }

    /* Item-head: row gap-8 */
    .item-head {
      display: flex;
      align-items: center;
      gap: var(--gap-8);
    }

    .item-head span {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
    }

    /* Item-link */
    .item-link {
      color: var(--text-blue-500);
      text-decoration: underline;
      padding-left: var(--gap-16);
    }
  </style>

</head>
