<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design History — proto-template</title>
  <style>
    /* Reset minimale */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }

    /* Token inline — stessa palette del progetto */
    :root {
      --color-primary:        #3b5bdb;
      --color-primary-hover:  #364fc7;
      --color-primary-subtle: #e7edff;
      --color-background:     #f8f9fa;
      --color-surface:        #ffffff;
      --color-text:           #1a1a2e;
      --color-text-muted:     #6b7280;
      --color-border:         #dee2e6;
      --font:    'Inter', system-ui, sans-serif;
      --mono:    'JetBrains Mono', monospace;
      --radius:  8px;
      --shadow:  0 4px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: var(--font);
      background: var(--color-background);
      color: var(--color-text);
      line-height: 1.6;
      padding: 48px 40px;
      min-height: 100vh;
    }

    /* Header */
    .header {
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--color-border);
    }
    .header__title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .header__sub {
      color: var(--color-text-muted);
      font-size: .9375rem;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Card */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: box-shadow 150ms ease;
    }
    .card:hover { box-shadow: var(--shadow); }

    .card__body { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    .card__title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag {
      font-family: var(--mono);
      font-size: .7rem;
      background: var(--color-primary-subtle);
      color: var(--color-primary);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .hash {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--color-text-muted);
    }

    .date {
      font-size: .8125rem;
      color: var(--color-text-muted);
      margin-left: auto;
    }

    /* Actions */
    .card__actions {
      display: flex;
      gap: 8px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: .875rem;
      font-weight: 500;
      transition: background 150ms ease, color 150ms ease;
    }

    .btn-primary {
      background: var(--color-primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--color-primary-hover); }

    .btn-secondary {
      background: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
    }
    .btn-secondary:hover {
      background: var(--color-primary-subtle);
    }

    /* Empty state */
    .empty {
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .empty pre {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: .8125rem;
      line-height: 1.8;
      width: fit-content;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1 class="header__title">Design History</h1>
    <p class="header__sub">proto-template &mdash; 1 prototipo</p>
  </header>

  <div class="grid">
    <article class="card">
      <div class="card__body">
        <h2 class="card__title">Dashboard: pannello Help con bottone sticky e accordion</h2>
        <div class="card__meta">
          <span class="tag">proto/dashboard/help-panel</span>
          <span class="hash">c3200af</span>
          <span class="date">06 agosto 2026</span>
        </div>
      </div>
      <div class="card__actions">
        <a class="btn-secondary" href="snapshots/dashboard-help-panel/protos/dashboard/index-mobile.html" target="_blank">index-mobile</a><a class="btn-primary" href="snapshots/dashboard-help-panel/protos/dashboard/index.html" target="_blank">Prototipo</a><a class="btn-secondary" href="snapshots/dashboard-help-panel/protos/dashboard/index2.html" target="_blank">index2</a><a class="btn-secondary" href="snapshots/dashboard-help-panel/protos/dashboard/index3.html" target="_blank">index3</a><a class="btn-secondary" href="snapshots/dashboard-help-panel/protos/dashboard/index4.html" target="_blank">index4</a><a class="btn-secondary" href="snapshots/dashboard-help-panel/protos/dashboard/index5-tabs-overflow.html" target="_blank">index5-tabs-overflow</a>
      </div>
    </article></div>
</body>
</html>
